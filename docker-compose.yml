services:
  # ============================================================
  # Infrastructure
  # ============================================================

  postgres:
    image: postgres:16-alpine
    container_name: ibrat-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ibrat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ibrat_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-ibrat}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init-databases.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ibrat}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ibrat-network

  redis:
    image: redis:7-alpine
    container_name: ibrat-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ibrat-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: ibrat-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - ibrat-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: ibrat-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 15
    networks:
      - ibrat-network

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.10.0
    container_name: ibrat-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15
    networks:
      - ibrat-network

  # ============================================================
  # API Gateway
  # ============================================================

  api-gateway:
    build:
      context: ./infrastructure/nginx
      dockerfile: Dockerfile
    container_name: ibrat-gateway
    ports:
      - "80:80"
    depends_on:
      user-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
      search-service:
        condition: service_healthy
      cart-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
    networks:
      - ibrat-network

  # ============================================================
  # Microservices
  # ============================================================

  user-service:
    build:
      context: ./services/user-service
      dockerfile: Dockerfile
    container_name: ibrat-user-service
    env_file: .env
    environment:
      - DATABASE_URL=${USER_DB_URL:-postgresql+asyncpg://ibrat:ibrat_dev_password@postgres:5432/user_db}
      - DATABASE_URL_SYNC=${USER_DB_URL_SYNC:-postgresql://ibrat:ibrat_dev_password@postgres:5432/user_db}
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      - user_uploads:/app/uploads
    networks:
      - ibrat-network

  product-service:
    build:
      context: ./services/product-service
      dockerfile: Dockerfile
    container_name: ibrat-product-service
    env_file: .env
    environment:
      - DATABASE_URL=${PRODUCT_DB_URL:-postgresql+asyncpg://ibrat:ibrat_dev_password@postgres:5432/product_db}
      - DATABASE_URL_SYNC=${PRODUCT_DB_URL_SYNC:-postgresql://ibrat:ibrat_dev_password@postgres:5432/product_db}
    ports:
      - "8002:8002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      - product_uploads:/app/uploads
    networks:
      - ibrat-network

  search-service:
    build:
      context: ./services/search-service
      dockerfile: Dockerfile
    container_name: ibrat-search-service
    env_file: .env
    ports:
      - "8003:8003"
    depends_on:
      elasticsearch:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - ibrat-network

  cart-service:
    build:
      context: ./services/cart-service
      dockerfile: Dockerfile
    container_name: ibrat-cart-service
    env_file: .env
    environment:
      - DATABASE_URL=${CART_DB_URL:-postgresql+asyncpg://ibrat:ibrat_dev_password@postgres:5432/cart_db}
      - DATABASE_URL_SYNC=${CART_DB_URL_SYNC:-postgresql://ibrat:ibrat_dev_password@postgres:5432/cart_db}
    ports:
      - "8004:8004"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8004/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - ibrat-network

  inventory-service:
    build:
      context: ./services/inventory-service
      dockerfile: Dockerfile
    container_name: ibrat-inventory-service
    env_file: .env
    environment:
      - DATABASE_URL=${INVENTORY_DB_URL:-postgresql+asyncpg://ibrat:ibrat_dev_password@postgres:5432/inventory_db}
      - DATABASE_URL_SYNC=${INVENTORY_DB_URL_SYNC:-postgresql://ibrat:ibrat_dev_password@postgres:5432/inventory_db}
    ports:
      - "8005:8005"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8005/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      - inventory_uploads:/app/uploads
    networks:
      - ibrat-network

  # ============================================================
  # Frontend
  # ============================================================

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ibrat-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost/api
      - NEXT_PUBLIC_SITE_NAME=Ibrat
    depends_on:
      api-gateway:
        condition: service_started
    networks:
      - ibrat-network

# ============================================================
# Volumes
# ============================================================
volumes:
  postgres_data:
  redis_data:
  zookeeper_data:
  kafka_data:
  elasticsearch_data:
  user_uploads:
  product_uploads:
  inventory_uploads:

# ============================================================
# Networks
# ============================================================
networks:
  ibrat-network:
    driver: bridge
